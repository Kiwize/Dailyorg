version: "3.9"
services:
  backend:
    container_name: backend
    image: dailyorg_backend
    env_file:
      - .env
    build:
      context: ./eclipse-workspace/dailyorg_java
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - dailyorg-app-network

  frontend:
    container_name: frontend
    image: dailyorg_frontend
    env_file:
      - .env
    build:
      context: ./dailyorg-frontend-react
      args:
        APP_API_URL: ${APP_API_URL}
    ports:
      - "81:80"
    depends_on:
      - backend
    networks:
      - dailyorg-app-network

  redis:
    image: redis:latest
    container_name: dailyorg_redis
    ports:
      - "6379:6379"
    networks:
      - dailyorg-app-network

  mysql:
    image: mysql
    container_name: dailyorg_mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - dailyorg-app-network

networks:
  dailyorg-app-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
