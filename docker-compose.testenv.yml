version: "3.9"
services:
  redis:
    image: redis:latest
    container_name: dailyorg_redis
    ports:
      - "6379:6379"
    networks:
      - dailyorg-app-network

  mysql:
    image: mysql
    container_name: dailyorg_mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    restart: unless-stopped
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - dailyorg-app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dailyorg_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:80"
    depends_on:
      - mysql
    networks:
      - dailyorg-app-network

networks:
  dailyorg-app-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
